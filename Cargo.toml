[package]
name = "LmmPyLauncher"
version = "0.1.7"
edition = "2021"
description = "LmmPyLauncher — 通用 Python 桌面应用启动器（Slint GUI）"

[lib]
# 公共逻辑（安装/更新/启动/配置）。不依赖 Slint，CLI 版因此不必链接 GUI 依赖。
name = "lmm_launcher"
path = "src/lib.rs"

[[bin]]
# GUI 版：windows 子系统 + Slint splash
name = "LmmPyLauncher"
path = "src/bin/gui.rs"

[[bin]]
# CLI 版：console 子系统，输出直连控制台，参数与退出码透传
name = "LmmPyLauncherCli"
path = "src/bin/cli.rs"

[dependencies]
# 精简 feature：仅 winit 后端 + femtovg 渲染器，去掉 accessibility 等额外组件
slint = { version = "1", default-features = false, features = [
    "std",
    "compat-1-0",
    "backend-winit",
    # skia 渲染器：femtovg 对 CJK 粗体/亚像素定位的字形渲染有缺陷（重影、糊），
    # skia 文本渲染质量显著更好，代价是二进制增大约 3-4MB
    "renderer-skia",
] }
ureq = "2"
serde_json = "1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tempfile = "3"

[build-dependencies]
slint-build = "1"
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
